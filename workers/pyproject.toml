[project]
name = "feng-workers"
version = "0.1.0"
description = "Feng Hotpot backend workers: seed loading, embeddings, scoring, outreach drafts, weekly brief"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "anthropic>=1.0",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pgserver>=0.1.4",   # embedded Postgres + pgvector for local tests, no Docker needed
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feng_workers"]
